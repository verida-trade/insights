<!DOCTYPE html>
<html lang="pt-BR" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Insights Quantitativos — CT Lab</title>
  
  <link rel="icon" type="image/svg+xml" href="https://verida.trade/favicon.svg">

  <!-- Motor CSS utilitário para renderizar as classes idênticas ao verida.trade -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <style>
    :root {
      --color-bg: #0a0a0a;
      --color-bg-elevated: #141414;
      --color-bg-card: #1a1a1a;
      --color-border: #2a2a2a;
      --color-text: #f5f5f5;
      --color-text-muted: #a3a3a3;
      --color-text-dim: #858585;
      --color-accent: #f59e0b;
      --color-accent-hover: #d97706;
      --color-positive: #22c55e;
      --color-negative: #ef4444;
      --color-ink: #0a0a0a;
    
      --font-sans: "Inter", system-ui, -apple-system, sans-serif;
      --font-mono: "JetBrains Mono", "Fira Code", monospace;
    }
    
    body {
      background-color: var(--color-bg);
      color: var(--color-text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* Utilitários personalizados extras da identidade */
    .text-gradient {
      background: linear-gradient(to right, #f8fafc, var(--color-accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    
    .btn-primary {
      background-color: var(--color-text);
      color: var(--color-ink);
      transition: opacity 0.2s;
    }
    .btn-primary:hover { opacity: 0.9; }
    
    .card {
      background-color: var(--color-bg-elevated);
      border: 1px solid var(--color-border);
      transition: all 0.2s ease;
    }
    .card:hover {
      border-color: var(--color-text-dim);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- HEADER IDÊNTICO AO PRINCIPAL -->
  <header class="fixed top-0 left-0 right-0 z-50 border-b border-[var(--color-border)] bg-[var(--color-bg)]/80 backdrop-blur-xl">
    <div class="mx-auto flex h-16 max-w-7xl items-center justify-between px-6">
      <a href="/" class="flex items-center gap-2.5">
        <img src="https://verida.trade/images/logo-verida.svg" width="32" height="32" alt="verida.trade" class="shrink-0">
        <span class="text-lg font-semibold tracking-tight text-[var(--color-text)]">CT Lab · Insights</span>
      </a>
    </div>
  </header>

<main class="flex-grow pt-24 pb-20">
    <section class="relative overflow-hidden pt-12 pb-12">
      <!-- (O fundo e o título continuam iguais ao que já definimos) -->
      <div class="absolute inset-0 -z-10">
        <div class="absolute left-1/2 top-0 h-[600px] w-[600px] -translate-x-1/2 rounded-full bg-[var(--color-accent)] opacity-[0.07] blur-[120px]"></div>
      </div>
      <div class="mx-auto max-w-4xl text-center px-6">
        <h1 class="text-balance text-4xl font-bold leading-tight tracking-tight sm:text-5xl md:text-6xl text-[var(--color-text)]">Backtests que <br/><span class="text-gradient">não mentem.</span></h1>
      </div>
    </section>

    <section class="mx-auto max-w-7xl px-6">
      
      <!-- Barra de Pesquisa -->
      <div class="mb-8">
        <input type="text" id="searchInput" placeholder="Buscar por ativo, título ou pesquisador..." class="w-full md:w-1/2 bg-[var(--color-bg-elevated)] border border-[var(--color-border)] text-[var(--color-text)] px-4 py-3 rounded-lg focus:outline-none focus:border-[var(--color-accent)] transition-colors">
      </div>

      <!-- O Grid onde o JavaScript vai injetar os cards -->
      <div id="gridContainer" class="grid gap-6 md:grid-cols-2 lg:grid-cols-3 mb-12">
        <div class="text-[var(--color-text-muted)] p-6">Carregando estudos da rede...</div>
      </div>

      <!-- Controles de Paginação -->
      <div id="paginationControls" class="flex items-center justify-center gap-4">
        <button id="btnPrev" class="btn-primary px-4 py-2 text-sm font-semibold rounded-md disabled:opacity-50 disabled:cursor-not-allowed">Anterior</button>
        <span id="pageInfo" class="text-[var(--color-text-muted)] text-sm font-medium">Página 1</span>
        <button id="btnNext" class="btn-primary px-4 py-2 text-sm font-semibold rounded-md disabled:opacity-50 disabled:cursor-not-allowed">Próxima</button>
      </div>

    </section>
  </main>

  <!-- Lógica da Paginação Estática -->
  <script>
    let allStudies = [];
    let filteredStudies = [];
    let currentPage = 1;
    const itemsPerPage = 12; // Altere para quantos cards quiser por página

    const gridContainer = document.getElementById('gridContainer');
    const searchInput = document.getElementById('searchInput');
    const btnPrev = document.getElementById('btnPrev');
    const btnNext = document.getElementById('btnNext');
    const pageInfo = document.getElementById('pageInfo');

    // 1. Busca os dados no primeiro carregamento
    async function loadData() {
      try {
        const response = await fetch('/api.json');
        allStudies = await response.json();
        
        // Opcional: Inverter para os relatórios mais novos aparecerem primeiro
        allStudies.reverse(); 
        
        filteredStudies = allStudies;
        renderPage(1);
      } catch (error) {
        gridContainer.innerHTML = '<div class="text-[var(--color-negative)]">Erro ao carregar a rede de estudos.</div>';
      }
    }

    // 2. Renderiza os cards da página atual
    function renderPage(page) {
      currentPage = page;
      
      const totalPages = Math.ceil(filteredStudies.length / itemsPerPage);
      if(totalPages === 0) {
        gridContainer.innerHTML = '<div class="text-[var(--color-text-muted)] col-span-full">Nenhum estudo encontrado.</div>';
        pageInfo.innerText = `Página 0 de 0`;
        btnPrev.disabled = true;
        btnNext.disabled = true;
        return;
      }

      // Calcula os limites do array para a página atual
      const startIndex = (currentPage - 1) * itemsPerPage;
      const endIndex = startIndex + itemsPerPage;
      const currentItems = filteredStudies.slice(startIndex, endIndex);

      // Constrói o HTML dos Cards dinamicamente
      gridContainer.innerHTML = currentItems.map(item => {
        
        // Monta os campos de dados baseados nas variáveis que existem no arquivo
        let metricsHtml = '';
        const metricKeys = Object.keys(item.metrics);
        
        if (metricKeys.length > 0) {
          metricsHtml = metricKeys.map((key, index) => {
            const isLast = index === metricKeys.length - 1;
            const borderClass = isLast ? '' : 'border-b border-[var(--color-border)]/50';
            
            // Embeleza o nome da chave (Ex: "win_rate" vira "Win rate")
            const formattedKey = key.replace(/_/g, ' ').replace(/^./, str => str.toUpperCase());
            const val = item.metrics[key];
            
            // Destaque visual: pinta de verde se for um número positivo atrelado a "profit" ou "lucro"
            let valueClass = 'text-[var(--color-text)] font-semibold';
            if (String(val).includes('%') || !isNaN(val)) {
              if (parseFloat(val) > 0 && (key.toLowerCase().includes('profit') || key.toLowerCase().includes('lucro'))) {
                valueClass = 'text-[var(--color-positive)] font-bold';
              }
            }

            return `
              <div class="flex justify-between py-1.5 ${borderClass}">
                <span class="text-[var(--color-text-dim)]">${formattedKey}:</span> 
                <span class="${valueClass} text-right ml-4 truncate">${val}</span>
              </div>
            `;
          }).join('');
        } else {
          // Se o arquivo .md não tiver nenhuma variável técnica, exibe uma mensagem discreta
          metricsHtml = '<div class="text-center py-2 text-[var(--color-text-dim)] opacity-50">Sem métricas tabuladas</div>';
        }

        return `
          <a href="${item.url}" class="card group flex flex-col justify-between rounded-xl p-6">
            <div>
              <div class="mb-4 flex items-center justify-between">
                <div class="flex h-10 w-10 items-center justify-center rounded-lg bg-[var(--color-accent)]/10 text-[var(--color-accent)]">
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
                </div>
                <span class="rounded-full bg-[var(--color-accent)]/10 px-2.5 py-1 text-xs font-medium text-[var(--color-accent)] uppercase tracking-wider">${item.category}</span>
              </div>
              <h3 class="mb-2 text-lg font-semibold text-[var(--color-text)] line-clamp-2 leading-tight">${item.title}</h3>
              <p class="text-[var(--color-text-dim)] text-xs mb-4 truncate">Autor: ${item.author}</p>
            </div>
            <div class="mt-auto rounded-lg bg-black/30 p-3 text-xs font-mono text-[var(--color-text-muted)] border border-[var(--color-border)]/50">
              ${metricsHtml}
            </div>
          </a>
        `;
      }).join('');

      // Atualiza os botões
      pageInfo.innerText = `Página ${currentPage} de ${totalPages}`;
      btnPrev.disabled = currentPage === 1;
      btnNext.disabled = currentPage === totalPages;
    }

    // 3. Eventos de Clique e Pesquisa
    btnPrev.addEventListener('click', () => { if(currentPage > 1) renderPage(currentPage - 1); });
    btnNext.addEventListener('click', () => { 
      if(currentPage < Math.ceil(filteredStudies.length / itemsPerPage)) renderPage(currentPage + 1); 
    });

    searchInput.addEventListener('input', (e) => {
      const term = e.target.value.toLowerCase();
      filteredStudies = allStudies.filter(study => 
        study.title.toLowerCase().includes(term) ||
        study.asset.toLowerCase().includes(term) ||
        study.author.toLowerCase().includes(term)
      );
      renderPage(1); // Volta para a primeira página após pesquisar
    });

    // Inicia o app
    loadData();
  </script>

  <footer class="border-t border-[var(--color-border)] bg-[var(--color-bg)]">
    <div class="mx-auto max-w-7xl px-6 py-8 flex flex-col sm:flex-row items-center justify-between gap-4">
      <div class="flex items-center gap-2">
        <img src="https://verida.trade/images/logo-verida.svg" width="24" height="24" alt="verida.trade" class="grayscale opacity-50">
        <p class="text-sm text-[var(--color-text-dim)]">© 2026 verida.trade. Laboratório de trading guiado por IA.</p>
      </div>
      <a href="https://verida.trade/doctrine" class="text-sm text-[var(--color-text-dim)] hover:text-[var(--color-text)] transition-colors">Doutrina</a>
    </div>
  </footer>

</body>
</html>
