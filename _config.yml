title: Verida Insights
description: Trading studies, backtests, and ML pipelines published by CT Lab users.
url: https://insights.verida.trade
baseurl: ""

# Jekyll settings
markdown: kramdown
highlighter: rouge

# Páginas em subpastas da raiz são servidas pelo path do arquivo.
# Ex: /users/abc-123/my-report.md → URL: /users/abc-123/my-report/
defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "post"

# Exclude build artifacts
exclude:
  - README.md
  - CNAME
  - Gemfile
  - Gemfile.lock
  - .git
